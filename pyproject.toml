[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saunet_experiments"
version = "0.1.0"
authors = [{name = "Anonymous-for-review"}]
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.17.0",
    "timm>=0.9.2",
    "datasets>=2.14.0",
    "huggingface-hub>=0.19.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "scipy>=1.11.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "fvcore @ git+https://github.com/facebookresearch/fvcore.git",
    "tensorboard>=2.15.0",
    "decord>=0.6.0" # required for Experiment-3 video streaming
]